<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Google Photos Links</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap">
<header><div class="logo"><i>▶</i>My Videos</div>
<nav><a href="/">Videos</a><a class="on" href="/link.html">Google Photos</a></nav></header>

<div class="add">
  <input id="t" placeholder="Name (optional)">
  <div class="row"><input id="g" type="url" inputmode="url" placeholder="Paste Google Photos link"><button class="btn" id="go">Save link</button></div>
  <div class="msg" id="s"></div>
</div>

<h2>Saved links</h2>
<div class="links" id="l"></div>

<script>
const $ = id => document.getElementById(id);
const host = u => { try { return new URL(u).host; } catch { return u; } };
async function load(){
  let items = []; try { items = await (await fetch("/api/links")).json(); } catch {}
  const l = $("l"); l.innerHTML = "";
  if(!items.length){ l.innerHTML = '<div class="empty">No links saved yet. Paste one above.</div>'; return; }
  items.forEach(it => {
    const d = document.createElement("div"); d.className = "lk";
    d.innerHTML = '<div class="ic">📷</div><a target="_blank" rel="noopener"><b></b><span></span></a><button class="btn ghost">Delete</button>';
    const a = d.querySelector("a"); a.href = it.url;
    a.querySelector("b").textContent = it.title || "Google Photos video"; a.querySelector("span").textContent = it.url;
    d.querySelector("button").onclick = async () => { await fetch("/api/links?id="+it.id,{method:"DELETE"}); load(); };
    l.append(d);
  });
}
async function save(){
  const url = $("g").value.trim(), m = $("s");
  if(!/^https?:\/\//.test(url)){ m.textContent = "Paste a valid link"; m.className = "msg err"; return; }
  const r = await fetch("/api/links",{method:"POST",body:JSON.stringify({url,title:$("t").value.trim()})});
  m.textContent = r.ok ? "Saved" : "Couldn't save, try again"; m.className = "msg " + (r.ok ? "ok" : "err");
  if(r.ok){ $("g").value = ""; $("t").value = ""; load(); }
}
$("go").onclick = save;
$("g").addEventListener("keydown", e => { if(e.key==="Enter") save(); });
load();
</script></div></body></html>
