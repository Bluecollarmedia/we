<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Photos Link</title>
<style>
body{font-family:system-ui;background:#111;color:#eee;padding:16px;max-width:1100px;margin:auto}
input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;border-radius:8px;border:0;margin:12px 0}
button{background:#2a7fff;color:#fff;border:0;border-radius:8px;padding:14px 20px;font-size:18px}
</style></head><body>
<h1>Google Photos Link</h1>
<nav style="margin-bottom:12px"><a href="/" style="color:#7ab4ff">Upload</a> &nbsp;|&nbsp; <a href="/link.html" style="color:#fff"><b>Google Photos link</b></a></nav>
<input id="g" type="url" placeholder="Paste Google Photos link">
<button id="go">Open in Google Photos</button>
<script>
document.getElementById("go").onclick = () => {
  const u = document.getElementById("g").value.trim();
  if (/^https?:\/\//.test(u)) location.href = u;
};
</script></body></html>
