<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Videos</title>
<style>
body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:16px;max-width:1100px;margin:auto}
video{width:100%;background:#000;border-radius:8px;margin-top:12px}
button,label.b{background:#2a7fff;color:#fff;border:0;border-radius:8px;padding:14px 20px;font-size:18px;display:inline-block}
input[type=file]{display:none}
progress{width:100%;height:14px;margin-top:10px}
.item{padding:14px;border-bottom:1px solid #333;font-size:18px;cursor:pointer}
</style></head><body>
<h1>My Videos</h1>
<label class="b">Upload video<input id="f" type="file" accept="video/*"></label>
<progress id="p" value="0" max="1" hidden></progress><div id="s"></div>
<div style="margin-top:16px"><input id="g" type="url" placeholder="Paste Google Photos link" style="width:65%;padding:14px;font-size:18px;border-radius:8px;border:0"> <button id="go">Open</button></div>
<video id="v" controls playsinline hidden></video>
<div id="l"></div>
<script>
const CH = 4 * 1024 * 1024, $ = id => document.getElementById(id);
const play = (it) => { const v = $("v"); v.hidden = false; v.src = "/api/video?id=" + it.id; v.play().catch(()=>{}); v.scrollIntoView(); };
async function load() {
  const items = await (await fetch("/api/list")).json();
  $("l").innerHTML = "";
  items.forEach(it => { const d = document.createElement("div"); d.className = "item";
    d.textContent = `${it.name} (${(it.size/1048576).toFixed(0)} MB)`; d.onclick = () => play(it); $("l").append(d); });
  return items;
}
async function post(url, body, tries = 5) {
  for (let t = 0; t < tries; t++) {
    try { const r = await fetch(url, { method: "POST", body }); if (r.ok) return; } catch {}
    await new Promise(r => setTimeout(r, 1000 * (t + 1)));
  }
  throw new Error("upload failed");
}
$("f").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const count = Math.ceil(file.size / CH), p = $("p"); p.hidden = false; p.max = count; p.value = 0;
  try {
    for (let i = 0; i < count; i++) {
      $("s").textContent = `Uploading ${i + 1}/${count}…`;
      await post(`/api/upload?id=${id}&i=${i}`, file.slice(i * CH, (i + 1) * CH));
      p.value = i + 1;
    }
    await post(`/api/upload?id=${id}&done=1`, JSON.stringify({ name: file.name, type: file.type || "video/mp4", size: file.size, chunkSize: CH, count }));
    $("s").textContent = "Done!"; const items = await load(); play(items.find(x => x.id === id) || items[0]);
  } catch (err) { $("s").textContent = "Error: " + err.message; }
};
$("go").onclick = () => { const u = $("g").value.trim(); if (/^https?:\/\//.test(u)) window.open(u, "_blank", "noopener"); };
load();
</script></body></html>
